# MARVCI822: the repo's only workflow was the secret gate -- vitest and tsc
# never ran in CI for ANY PR, so every "N/N green" claim was a local
# measurement the PR head could not prove (found via the review of
# #1037/#1038, measured 2026-08-22).
#
# Deliberately NOT a required status check yet: flipping it to required at
# introduction would block every open PR whose head predates the workflow
# (the required-check-never-ran class). The switch to required is a separate
# owner/Marveen decision, gated on measuring how many open PRs run it green
# (decision msg 14205, recorded on the MARVCI822 card).
name: test

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Full install ON PURPOSE, unlike the secret-gate's --ignore-scripts:
      # the suite exercises native bindings, and an install that skips their
      # build would fail the ABI probe instead of measuring the code.
      - run: npm ci
      # #1565 item 4: the channel-image-resize tests build a REAL >500KB JPEG
      # with ffmpeg (a Buffer.alloc fixture let the hook claim a resize it never
      # did). ffmpeg is an installer dependency (install-linux.sh), so the
      # runner must have it too -- a missing binary is a real failure there,
      # not a reason to skip. ubuntu-latest does not ship it (measured: run
      # 36302092314, spawnSync ffmpeg ENOENT).
      - name: Install ffmpeg for the resize hook's tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The suite resolves the `claude` binary at module load (resolveFromPath
      # throws when it is absent) -- without this stub 17 suites fail at
      # COLLECTION, before a single test runs (measured on the first ubuntu
      # run). The stub satisfies PATH resolution only; it exits 1 LOUDLY, so if
      # any test ever actually executes claude, that run fails visibly instead
      # of silently faking success.
      - name: Stub the claude binary for PATH resolution
        run: |
          sudo install -m 755 /dev/stdin /usr/local/bin/claude <<'EOF'
          #!/bin/sh
          echo "claude CI stub: tests must not execute this binary" >&2
          exit 1
          EOF
      - run: npm run typecheck
      - run: npm test
      # Shell-test wiring (SEEDREFRESH826 fold-in, from the #1066 verify): a
      # regression guard that only runs manually rots exactly like a one-shot
      # seed. Runs natively here (ubuntu = the Linux branch it asserts).
      - run: bash scripts/__tests__/stop-start-system-unit.test.sh
      # TASKEGRESSDRIFT913: the egress-drift scan is a gate instrument; a guard that
      # only runs by hand rots (the #1316 class), so its tests run here too.
      - run: python3 scripts/__tests__/egress-drift-scan.test.py
      # DASHAUDITZAJ915: the dash audit's classifier is a gate instrument too --
      # same rot argument as the line above.
      - run: python3 scripts/__tests__/dash-audit-scan.test.py
      # ORSICTX912: the sentinel preCheck's SKIP is "no model turn" -- an
      # error path that said SKIP would silence the community sentinel for
      # good, so its fail-direction cases are gate instruments (hermetic:
      # stubbed vault/supabase, throwaway dirs).
      - run: python3 scripts/__tests__/mio-orszem-precheck.test.py
      # MEMLINKAUDIT915: the audit's own footer calls UNRESOLVED the repair
      # queue, so an over-report sends someone to rewrite working links. The
      # over-report GROWS with every consolidation round, which is why this
      # runs here and not by hand. Hermetic: throwaway fixture dir.
      - run: python3 scripts/__tests__/memory-link-audit.test.py
      # IMAGESAFETY1020: the image screen is fail-closed only if its quarantine,
      # error and symlink paths stay tested. Hermetic: mock detectors, temp dirs,
      # no model files (the real detectors need Mira's venv and are skipped).
      - run: python3 scripts/__tests__/image-safety-check.test.py
      # TGPIN1103: the pin script holds the main bot's token; its "never in the
      # output or log" and "only allowed chats" cases are the gate. Hermetic:
      # stub Bot API on localhost, synthetic token, throwaway dir.
      - run: python3 scripts/__tests__/telegram-pin.test.py
      # PRIVATEWINDOW1106: the owner-reply gate (product images, private-chat marker,
      # private window 0600). Hermetic: throwaway CLAUDE_PROJECT_DIR, no dashboard call.
      - run: python3 -I scripts/hooks/product-image-gate_test.py
      # MORNTIMERPARK914: the #1313 contract tests shipped without CI wiring,
      # so "CI green" said nothing about them -- the exact rot the comment
      # above warns about. All three are hermetic (stubs on PATH / CLAUDE_BIN,
      # throwaway dirs); the stamp-gate test never reaches the claude stub
      # above because the briefing script takes its binary from CLAUDE_BIN.
      - run: bash scripts/__tests__/keepalive-probe-install.test.sh
      - run: bash scripts/__tests__/morning-stamp-gate.test.sh
      - run: bash scripts/__tests__/morning-timer-park.test.sh
      - run: bash scripts/__tests__/userbot-arming-gate.test.sh
      - run: bash scripts/__tests__/supabase-q-token-hiding.test.sh
      # HOSTBEAT1113 (card 8fbd8b7b): the host-heartbeat ping + installer, hermetic (curl, pbpaste, pbcopy
      # stubbed on PATH, HOME in a temp dir); the plist checks skip off macOS.
      - run: bash scripts/__tests__/host-heartbeat.test.sh
      # WORKTREEADD1021: throwaway git repos in a temp dir, no network.
      - run: bash scripts/__tests__/worktree-add.test.sh
      # Retro R7 (card a8354557): the push-time related-tests gate and its installer; temp bare origin + clone, npx a PATH shim, no network.
      - run: bash scripts/__tests__/related-tests-gate.test.sh
      # Klodel 36866: curl and sleep stubbed on PATH, state file in a temp dir, no network.
      - run: bash scripts/__tests__/agent-msg-majsztro-copy.test.sh
      # Klodel 37971/37978: the business-idea gate lint (banned directions at a word start only); temp files, no network.
      - run: python3 -I scripts/__tests__/uzleti-otlet-kapu-lint.test.py
      # Card aba42256: secret shapes (read from src/security/secret-gate.ts) and Majsztro's length/e-mail rule;
      # curl and sleep stubbed on PATH, no network.
      - run: bash scripts/__tests__/agent-msg-send-gate.test.sh
      # Retro R10 (card 1f943050): the absence-claim lint the send gate runs on Radar's delivered files; temp files.
      - run: python3 -I scripts/__tests__/hiany-lint.test.py
      # WTPRUNESQUASH1106: the prune decides what `git worktree remove` takes;
      # its "keep unmerged work" cases are the gate. Throwaway git repos in a
      # temp dir, a stub lsof, no network.
      - run: python3 scripts/__tests__/worktree-prune-squash.test.py
      # REPLAYTOOL924: the reply-tool naming in the ledger hooks had tests that
      # only ran by hand, so a green PR said nothing about them. All three are
      # hermetic (LEDGER_DB_PATH on a throwaway DB, temp dirs).
      - run: python3 scripts/__tests__/telegram-reply-guard.test.py
      - run: python3 scripts/__tests__/ledger-replay-reply-tool.test.py
      - run: bash scripts/__tests__/conversation-ledger.test.sh
      # The waiting clock + free-machine guard (Klodel 35735, Patrik TG 4453/4454) and the reply_to/files columns
      # ledger-outbound records for it. Hermetic: temp DB and store, synthetic chat ids, --dry.
      - run: python3 -I scripts/__tests__/patrik-varakozas.test.py
      # PRIVTOPIC1106 (card 6dbeadad, #123): the private-topic group gate blocks a
      # private project's words in the team group; its fail-closed cases (bad regex,
      # broken store, unknown private chat) are the gate. Hermetic: throwaway
      # CLAUDE_PROJECT_DIR, synthetic chat ids, no network.
      - run: python3 -I scripts/hooks/private-topic-group-gate_test.py
      # NOMEACULPA1109 (Klodel 34240, Patrik group TG 3795): no "igazad van / hibáztam /
      # ezentúl" reply to Patrik's chats. Hermetic: throwaway CLAUDE_PROJECT_DIR,
      # synthetic chat ids, no network.
      - run: python3 -I scripts/hooks/mea-culpa-reply-gate_test.py
      # MUTEVIDEO1110 (Klodel 35741, Patrik TG 4483 "a babás csak egy gif"): a video
      # without an audio track is blocked from a Telegram reply. Hermetic: synthetic
      # MP4 boxes; the real-ffmpeg cases skip where ffmpeg is missing.
      - run: python3 -I scripts/hooks/mute-video-reply-gate_test.py
      # CLAIMSOURCE1110 (Klodel 35761, Patrik group TG 4477): a state claim or a number to
      # Patrik's chats only with its source. Hermetic: throwaway CLAUDE_PROJECT_DIR.
      - run: python3 -I scripts/hooks/claim-source-reply-gate_test.py
      # The render-state claim gate (Klodel 35696, Patrik TG 4381): no "renderel" to Patrik without a fresh measurement.
      - run: python3 -I scripts/hooks/render-claim-reply-gate_test.py
      # PRKERDES1111 (hibanapló 2026-11-11, Klodel 37320): no "PR #<n> mehet?" to Patrik without the PR's full
      # file list and a picture or a reason per file. Hermetic: throwaway CLAUDE_PROJECT_DIR, fake GitHub.
      - run: python3 -I scripts/hooks/pr-kerdes-gate_test.py
      # KEYCHAINGATE1106 (card c1921b55, Viktor 29950): the Bash gate that stops an
      # agent shell from reading keychain secrets with `security`; its bypass forms
      # (wrappers, paths, escapes, bash -c, stdin mode) are the gate. Hermetic: the
      # commands are text only, no keychain call, no network.
      - run: python3 -I scripts/hooks/keychain-read-gate_test.py
      # TIMECLAIM1111 (Klodel 38401): no placeholder (19:3x) or future "measured" time in
      # shared/*.md or a kanban comment. Hermetic: a copy of the hook in a temp root.
      - run: python3 -I scripts/hooks/time-claim-gate_test.py
      # LINKKAPU1112 (Patrik TG 17974, TG 18022 "a linket kértem"): a reply to a chat whose latest inbound
      # message asks for a link carries a URL or a "LINK-NINCS: <why>" line. Pure check(), no ledger, no network.
      - run: python3 -I scripts/hooks/link-request-reply-gate_test.py
      # UPDATEAPPLY1113 (Klodel 39791, card 840231cf): no direct marveen-update-safe.py --apply from an agent shell,
      # only through the approval gate. Hermetic: the commands are text only.
      - run: python3 -I scripts/hooks/update-apply-gate_test.py
      # COUNTCLAIM1113 (Klodel 39869): a count or an id in an opted-in agent's message / card comment needs a
      # MÉRVE: line. Hermetic: a throw-away install root, the commands are text only.
      - run: python3 -I scripts/hooks/count-claim-gate_test.py
      # ZSHTRAP1113 (retro 2026-11-13 R6, card cf287c2c): zsh word splitting, $V:s modifier, =-expansion and
      # rm -r on a variable, fleet-wide on every Bash call. Hermetic: the commands are text only.
      - run: python3 -I scripts/hooks/zsh-trap-gate_test.py
      # SESSIONMETA1113 (retro 2026-11-13 R8, card 84858637): no own-session meta line to Patrik's chats (Patrik TG 666).
      # Hermetic: owner chats from MARVEEN_OWNER_CHATS or a throw-away CLAUDE_PROJECT_DIR.
      - run: python3 -I scripts/hooks/session-meta-reply-gate_test.py
      # SUMMARYFORM1113 (retro 2026-11-13 R9, card dddca664): the main agent's summaries to Patrik are plain sentences
      # (Patrik TG 4735). Hermetic: owner chats from MARVEEN_OWNER_CHATS, no ledger read.
      - run: python3 -I scripts/hooks/summary-form-reply-gate_test.py
      # UPDATESAFE1113 (Klodel 39777, card 840231cf): update.sh wrapper that parks carried-over files, merges the
      # local settings.json difference back and stops before a drop. Hermetic: throw-away git repos, fake update.sh.
      - run: python3 -I scripts/__tests__/marveen-update-safe.test.py
      - run: python3 -I scripts/__tests__/seo-copy-gate.test.py
      - run: python3 -I scripts/__tests__/mcp-pin-run.test.py
